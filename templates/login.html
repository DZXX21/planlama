<!DOCTYPE html>
<html lang="tr" class="h-full antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Giriş Yap - Nexus Planner</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' },
                        dark: { 800: '#1e293b', 900: '#0f172a', 950: '#020617' }
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'slide-up': 'slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        slideUp: {
                            'from': { transform: 'translateY(20px)', opacity: '0' },
                            'to': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            }
        }
        
        // Sistem temasını kontrol et
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>

    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .dark .glass-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.6;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50 dark:bg-dark-950 flex items-center justify-center p-4 relative overflow-hidden transition-colors duration-500">

    <div class="blob w-64 h-64 bg-purple-300 dark:bg-brand-900 top-0 left-0 -translate-x-1/2 -translate-y-1/2 rounded-full mix-blend-multiply dark:mix-blend-screen animate-float"></div>
    <div class="blob w-72 h-72 bg-blue-300 dark:bg-blue-900 bottom-0 right-0 translate-x-1/3 translate-y-1/3 rounded-full mix-blend-multiply dark:mix-blend-screen animate-float" style="animation-delay: 2s;"></div>

    <div class="w-full max-w-md glass-card rounded-3xl shadow-2xl relative z-10 p-8 md:p-10 animate-slide-up">
        
        <div class="text-center mb-8">
            <div class="w-14 h-14 mx-auto bg-gradient-to-br from-brand-500 to-brand-700 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-brand-500/30 mb-5 transform hover:scale-105 transition-transform duration-300">
                <i class="ph-bold ph-planet text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white tracking-tight">Hoş Geldiniz</h1>
            <p class="text-gray-500 dark:text-gray-400 text-sm mt-2 font-medium">NexusPlan ile gününüzü yönetin</p>
        </div>

        {% if error %}
        <div class="mb-6 p-4 bg-red-50/80 dark:bg-red-900/30 backdrop-blur text-red-600 dark:text-red-300 text-sm font-semibold rounded-xl border border-red-100 dark:border-red-800/50 flex items-center gap-3 animate-pulse">
            <i class="ph-fill ph-warning-circle text-xl"></i>
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-5">
            
            <div class="space-y-1.5 group">
                <label class="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider ml-1">Kullanıcı Adı</label>
                <div class="relative transition-all duration-300 transform group-focus-within:scale-[1.01]">
                    <div class="absolute left-4 top-3.5 text-gray-400 group-focus-within:text-brand-500 transition-colors">
                        <i class="ph-bold ph-user text-lg"></i>
                    </div>
                    <input type="text" name="username" required 
                           class="w-full bg-gray-50/50 dark:bg-dark-900/50 border border-gray-200 dark:border-gray-700 rounded-xl pl-11 pr-4 py-3 text-sm font-semibold text-gray-900 dark:text-white placeholder-gray-400 focus:bg-white dark:focus:bg-dark-900 focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 outline-none transition-all shadow-sm" 
                           placeholder="Kullanıcı adınız">
                </div>
            </div>

            <div class="space-y-1.5 group">
                <label class="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider ml-1">Şifre</label>
                <div class="relative transition-all duration-300 transform group-focus-within:scale-[1.01]">
                    <div class="absolute left-4 top-3.5 text-gray-400 group-focus-within:text-brand-500 transition-colors">
                        <i class="ph-bold ph-lock-key text-lg"></i>
                    </div>
                    <input type="password" name="password" required 
                           class="w-full bg-gray-50/50 dark:bg-dark-900/50 border border-gray-200 dark:border-gray-700 rounded-xl pl-11 pr-4 py-3 text-sm font-semibold text-gray-900 dark:text-white placeholder-gray-400 focus:bg-white dark:focus:bg-dark-900 focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 outline-none transition-all shadow-sm" 
                           placeholder="••••••••">
                </div>
                <div class="flex justify-end">
                    <a href="#" class="text-xs font-medium text-gray-400 hover:text-brand-500 transition-colors">Şifremi unuttum?</a>
                </div>
            </div>

            <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-brand-600/25 hover:shadow-brand-600/40 transition-all transform active:scale-[0.98] flex items-center justify-center gap-2 group">
                Giriş Yap
                <i class="ph-bold ph-arrow-right group-hover:translate-x-1 transition-transform"></i>
            </button>

        </form>

        <div class="mt-8 pt-6 border-t border-gray-100 dark:border-gray-800 text-center">
            <p class="text-sm text-gray-500 dark:text-gray-400">
                Hesabınız yok mu? 
                <a href="/register" class="text-brand-600 dark:text-brand-400 font-bold hover:underline decoration-2 decoration-brand-200 dark:decoration-brand-800 transition-all ml-1">Hemen Kayıt Ol</a>
            </p>
        </div>
    </div>

</body>
</html>
